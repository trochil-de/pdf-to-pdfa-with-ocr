name: Docker Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*-[0-9]*-[0-9]*'

jobs:
  build:
    runs-on: ubuntu-latest

    environment: docker-io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute Docker tags
        id: meta
        run: |
          IMAGE=${{ vars.DOCKER_USERNAME }}/$(basename ${{ github.repository }})

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tags=${IMAGE}:main,${IMAGE}:latest" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
      
            if [[ ! "$TAG" =~ ^[0-9]+-[0-9]+-[0-9]+$ ]]; then
              echo "Tag format invalid: $TAG"
              exit 1
            fi
      
            IFS='-' read -r MAJOR MINOR HOTFIX <<< "$TAG"
      
            TAG_HOTFIX="v-${MAJOR}-${MINOR}-${HOTFIX}"
            TAG_MINOR="v-${MAJOR}-${MINOR}"
            TAG_MAJOR="v-${MAJOR}"
      
            echo "tags=${IMAGE}:${TAG_HOTFIX},${IMAGE}:${TAG_MINOR},${IMAGE}:${TAG_MAJOR}" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unsupported ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
